name: Actualizar Dashboard SCS

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */4 * * *'

jobs:
  build:
    name: Generar y actualizar dashboard.json
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pandas

      - name: Ejecutar script de Python
        run: python generar_dashboard.py

      - name: Commit y Push de los cambios
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.sk"
          git add dashboard/dashboard.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-actualización del dashboard.json [skip ci]" && git push)
